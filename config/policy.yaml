# Guardrail policy — Owner: Member 2 · CONTRACTS C2 / C6, design B4
# Every limit / list the guardrail uses lives HERE, never in code.
# amount <= limit -> OK (so exactly 25000 is allowed, 25001 needs confirmation).

auto_limit_inr: 25000          # single payout above this -> NEEDS_CONFIRMATION (OVER_AUTO_LIMIT)
daily_auto_limit_inr: 25000    # per merchant per day, executed + pending payouts (stops split attacks)
offer_cooling_off_days: 7      # no new offer within N days of a declined one (placeholder; covers both products)
credit_line_after_loan_days: 30    # no credit line offer within N days of an accepted offer (total exposure)
disabled_offer_products: []        # kill switch per product: [credit_line] stops credit line offers only
device_nudge_every_days: 30        # at most one proactive device-upgrade nudge per merchant in N days
intent_confidence_threshold: 0.7   # below this the orchestrator hands off (M1 reads it)
retention_days: 90             # turns retention window (P2, compliance/retention.py)

# Actions the guardrail will even consider. Anything else -> BLOCK NOT_IN_ALLOW_LIST.
allow_list:
  - verify_ledger         # read-only
  - check_eligibility     # read-only
  - retrigger_payout      # money
  - raise_ticket
  - update_ticket
  - create_offer          # sales, always needs consent
  - request_device_upgrade   # sales: field-team request for a better device, always needs consent

# Hard no, in every version. Checked BEFORE the allow_list -> BLOCK NEVER_ALLOWED.
never_allowed:
  - debit_merchant_account

# Kill switch (RBI FREE-AI R5): add an action here to stop it instantly -> BLOCK ACTION_DISABLED.
disabled_actions: []

# Actions that always need the merchant's explicit consent (check 10).
# "any_irreversible" = any step with reversible == False.
consent_required:
  - create_offer
  - request_device_upgrade
  - any_irreversible

# PROACTIVE sessions (Chaukas reached out first; the merchant asked for nothing): these actions NEVER auto-execute,
# even under the limit. They need the merchant's explicit yes (check 10). See PROACTIVE_FEATURE_CHANGES.md.
proactive_consent_required:
  - retrigger_payout
  - create_offer
  - request_device_upgrade

# Read-only actions: pass checks 1-3, are traced, but are NOT written to audit_log.
read_only_actions:
  - verify_ledger
  - check_eligibility

# Money-moving actions: these count towards the daily limit (executions table).
money_actions:
  - retrigger_payout

# Canonical PII field names — must equal chaukas/privacy/pii.py PII_FIELDS.
pii_fields: [account_no, ifsc, vpa, pan, aadhaar, phone, name]
