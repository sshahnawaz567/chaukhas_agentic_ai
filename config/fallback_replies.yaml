# Deterministic reply templates used when the LLM is unavailable (and no recording exists), or its reply
# was rejected (ungrounded / wrong language).
# Facts are filled from the ledger / action results; nothing here is a policy number.
# Languages: hi-IN (Devanagari), hi-Latn (Hinglish, Latin script), mr-IN, en-IN (anything else falls back to en-IN).
hi-IN:
  all_good: "आपके सभी भुगतान सफल हैं, कोई पेमेंट पेंडिंग नहीं है।"
  retriggered: "आपका ₹{amount} का भुगतान दोबारा भेज दिया गया है।"
  ticket_raised: "टिकट {ticket_id} बना दिया गया है।"
  ticket_updated: "पहले से खुला टिकट {ticket_id} अपडेट कर दिया है।"
  over_limit: "यह रकम बड़ी है, इसलिए सुरक्षा के लिए हमारी टीम इसे वेरिफाई करके भेजेगी।"
  pending_wait: "आपका ₹{amount} का भुगतान बैंक की तरफ से प्रोसेस हो रहा है। लगभग {eta_hours} घंटे में आ जाना चाहिए।"
  kyc: "आपकी KYC पूरी नहीं है, इसलिए भुगतान रुका है। कृपया KYC पूरी करें: {kyc_link} — हमारी टीम आपकी मदद करेगी।"
  bank_not_updated: "आपके बैंक डिटेल्स अभी अपडेट नहीं हुए हैं, इसलिए भुगतान दोबारा भेजने पर फिर फेल होगा। कृपया बैंक डिटेल्स अपडेट करें; हमारी टीम आपसे संपर्क करेगी।"
  offer: "आप ₹{amount} तक के लोन के लिए पात्र हैं ({lender_name}). ब्याज {apr_pct}% सालाना, प्रोसेसिंग फीस ₹{fee}, अवधि {tenure} महीने, कुल वापसी ₹{total}. शिकायत: {grievance}. क्या मैं ऑफ़र भेजूँ?"
  offer_accepted: "आपका ₹{amount} का लोन ऑफ़र {offer_id} स्वीकार हो गया है।"
  offer_declined: "ठीक है, मैंने ऑफ़र नहीं भेजा।"
  offer_not_eligible: "अभी आप लोन के लिए पात्र नहीं हैं।"
  offer_later: "अभी लोन ऑफ़र देना सही नहीं है, बाद में बात करेंगे।"
  device_ticket: "आपकी डिवाइस की समस्या के लिए टिकट {ticket_id} दर्ज कर दिया है।"
  handoff: "मैं इसे हमारी टीम को भेज रहा हूँ, वे जल्द ही आपसे संपर्क करेंगे।"
  human: "ज़रूर, मैं आपको हमारी टीम के सदस्य से जोड़ रहा हूँ।"
  refund: "रिफंड मैं खुद नहीं कर सकता, इसलिए इसे हमारी टीम को भेज रहा हूँ।"
  action_failed: "भुगतान भेजने में दिक्कत आई, इसलिए कुछ नहीं बदला गया। हमारी टीम इसे देखेगी।"
  step_up: "इस रकम के लिए OTP वेरिफिकेशन ज़रूरी है; हमारी टीम इसे वेरिफाई करेगी।"
  unclear: "माफ़ कीजिए, मैं समझ नहीं पाया। मैं इसे हमारी टीम को भेज रहा हूँ।"
  nothing_pending: "अभी कोई पेंडिंग अनुरोध नहीं है। बताइए, मैं क्या मदद करूँ?"
hi-Latn:
  all_good: "Aapke saare settlements successful hain, koi payment pending nahi hai."
  retriggered: "Aapka ₹{amount} ka payment dobara bhej diya gaya hai."
  ticket_raised: "Ticket {ticket_id} bana diya gaya hai."
  ticket_updated: "Pehle se khula ticket {ticket_id} update kar diya hai."
  over_limit: "Yeh amount badi hai, isliye security ke liye hamari team ise verify karke bhejegi."
  pending_wait: "Aapka ₹{amount} ka payment bank ki taraf se process ho raha hai. Lagbhag {eta_hours} ghante mein aa jaana chahiye."
  kyc: "Aapki KYC poori nahi hai, isliye payment ruka hai. Kripya KYC poori karein: {kyc_link} — hamari team aapki madad karegi."
  bank_not_updated: "Aapki bank details abhi update nahi hui hain, isliye dobara bhejne par payment phir fail hoga. Kripya bank details update karein; hamari team aapse sampark karegi."
  offer: "Aap ₹{amount} tak ke loan ke liye eligible hain ({lender_name}). Byaaj {apr_pct}% saalana, processing fee ₹{fee}, avadhi {tenure} mahine, kul wapsi ₹{total}. Shikayat: {grievance}. Kya main offer bhejoon?"
  offer_accepted: "Aapka ₹{amount} ka loan offer {offer_id} accept ho gaya hai."
  offer_declined: "Theek hai, maine offer nahi bheja."
  offer_not_eligible: "Abhi aap loan ke liye eligible nahi hain."
  offer_later: "Abhi loan offer dena sahi nahi hai, baad mein baat karenge."
  device_ticket: "Aapki device ki problem ke liye ticket {ticket_id} darj kar diya hai."
  handoff: "Main ise hamari team ko bhej raha hoon, woh jaldi aapse sampark karenge."
  human: "Zaroor, main aapko hamari team ke member se jod raha hoon."
  refund: "Refund main khud nahi kar sakta, isliye ise hamari team ko bhej raha hoon."
  action_failed: "Payment bhejne mein dikkat aayi, isliye kuch nahi badla gaya. Hamari team ise dekhegi."
  step_up: "Is amount ke liye OTP verification zaroori hai; hamari team ise verify karegi."
  unclear: "Maaf kijiye, main samajh nahi paaya. Main ise hamari team ko bhej raha hoon."
  nothing_pending: "Abhi koi pending request nahi hai. Bataiye, main kya madad karoon?"
mr-IN:
  all_good: "तुमचे सर्व settlements यशस्वी झाले आहेत, कोणतेही पेमेंट प्रलंबित नाही."
  retriggered: "तुमचे ₹{amount} चे पेमेंट पुन्हा पाठवले आहे."
  ticket_raised: "तिकीट {ticket_id} तयार केले आहे."
  ticket_updated: "आधीपासून उघडे असलेले तिकीट {ticket_id} अपडेट केले आहे."
  over_limit: "ही रक्कम मोठी आहे, म्हणून सुरक्षेसाठी आमची टीम ती तपासून पाठवेल."
  pending_wait: "तुमचे ₹{amount} चे पेमेंट बँकेकडून प्रोसेस होत आहे. साधारण {eta_hours} तासांत ते जमा व्हायला हवे."
  kyc: "तुमची KYC पूर्ण नाही, त्यामुळे पेमेंट थांबले आहे. कृपया KYC पूर्ण करा: {kyc_link} — आमची टीम तुम्हाला मदत करेल."
  bank_not_updated: "तुमचे बँक डिटेल्स अजून अपडेट झालेले नाहीत, त्यामुळे पेमेंट पुन्हा पाठवले तर ते परत फेल होईल. कृपया बँक डिटेल्स अपडेट करा; आमची टीम तुमच्याशी संपर्क करेल."
  offer: "तुम्ही ₹{amount} पर्यंतच्या कर्जासाठी पात्र आहात ({lender_name}). व्याज {apr_pct}% वार्षिक, प्रोसेसिंग फी ₹{fee}, कालावधी {tenure} महिने, एकूण परतफेड ₹{total}. तक्रार: {grievance}. मी ऑफर पाठवू का?"
  offer_accepted: "तुमची ₹{amount} ची कर्ज ऑफर {offer_id} स्वीकारली गेली आहे."
  offer_declined: "ठीक आहे, मी ऑफर पाठवली नाही."
  offer_not_eligible: "सध्या तुम्ही कर्जासाठी पात्र नाही."
  offer_later: "सध्या कर्ज ऑफर देणे योग्य नाही, आपण नंतर बोलू."
  device_ticket: "तुमच्या डिव्हाइसच्या समस्येसाठी तिकीट {ticket_id} नोंदवले आहे."
  handoff: "मी हे आमच्या टीमकडे पाठवत आहे, ते लवकरच तुमच्याशी संपर्क करतील."
  human: "नक्कीच, मी तुम्हाला आमच्या टीमच्या सदस्याशी जोडत आहे."
  refund: "रिफंड मी स्वतः करू शकत नाही, म्हणून हे आमच्या टीमकडे पाठवत आहे."
  action_failed: "पेमेंट पाठवताना अडचण आली, त्यामुळे काहीही बदलले नाही. आमची टीम हे तपासेल."
  step_up: "या रकमेसाठी OTP पडताळणी आवश्यक आहे; आमची टीम ती तपासेल."
  unclear: "माफ करा, मला समजले नाही. मी हे आमच्या टीमकडे पाठवत आहे."
  nothing_pending: "सध्या कोणतीही प्रलंबित विनंती नाही. सांगा, मी काय मदत करू?"
en-IN:
  all_good: "All your settlements are successful, nothing is pending."
  retriggered: "Your payout of ₹{amount} has been re-sent."
  ticket_raised: "Ticket {ticket_id} has been created."
  ticket_updated: "Your existing ticket {ticket_id} has been updated."
  over_limit: "This amount is large, so for your security our team will verify it before sending."
  pending_wait: "Your ₹{amount} payout is being processed by the bank. It should arrive in about {eta_hours} hours."
  kyc: "Your KYC is incomplete, which is holding the payout. Please complete it here: {kyc_link} — our team will help you."
  bank_not_updated: "Your bank details are not updated yet, so a retry would fail again. Please update them; our team will reach out."
  offer: "You are eligible for a loan of up to ₹{amount} ({lender_name}). Interest {apr_pct}% p.a., processing fee ₹{fee}, tenure {tenure} months, total repayable ₹{total}. Grievance: {grievance}. Shall I send the offer?"
  offer_accepted: "Your loan offer {offer_id} for ₹{amount} is accepted."
  offer_declined: "Okay, I have not sent the offer."
  offer_not_eligible: "You are not eligible for a loan right now."
  offer_later: "It is not the right time for a loan offer; we can talk later."
  device_ticket: "I have logged ticket {ticket_id} for your device issue."
  handoff: "I am passing this to our team; they will contact you shortly."
  human: "Sure, I am connecting you to a member of our team."
  refund: "I cannot process refunds myself, so I am passing this to our team."
  action_failed: "The payout hit a problem, so nothing was changed. Our team will look into it."
  step_up: "This amount needs OTP verification; our team will verify it."
  unclear: "Sorry, I did not understand. I am passing this to our team."
  nothing_pending: "There is no pending request right now. How can I help?"
