  credit_line_offer: "Aap ₹{amount} tak ki short-term credit line ke liye eligible hain ({lender_name}). {free_days} din mein chukane par koi byaaj ya fee nahi; uske baad {apr_pct}% saalana byaaj aur ₹{late_fee} late fee. Shikayat: {grievance}. Kya main yeh credit line chalu karoon?"
  credit_line_accepted: "Aapki ₹{amount} ki credit line {offer_id} accept ho gayi hai."
  credit_line_not_eligible: "Abhi aap credit line ke liye eligible nahi hain."
  device_requested: "Aapke liye {device} ki request hamari field team ko bhej di gayi hai (ticket {ticket_id}). Woh aapse contact karke price batayenge; abhi kuch khareeda ya charge nahi hua."
