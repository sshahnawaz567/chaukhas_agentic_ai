gu-IN:
  all_good: "તમારા બધા settlements સફળ થયા છે, કોઈ પેમેન્ટ બાકી નથી."
  retriggered: "તમારું ₹{amount} નું પેમેન્ટ ફરીથી મોકલી દીધું છે."
  ticket_raised: "ટિકિટ {ticket_id} બનાવી દીધી છે."
  ticket_updated: "પહેલેથી ખુલ્લી ટિકિટ {ticket_id} અપડેટ કરી દીધી છે."
  over_limit: "આ રકમ મોટી છે, તેથી સુરક્ષા માટે અમારી ટીમ તેને ચકાસીને મોકલશે."
  pending_wait: "તમારું ₹{amount} નું પેમેન્ટ બેંક તરફથી પ્રોસેસ થઈ રહ્યું છે. લગભગ {eta_hours} કલાકમાં આવી જવું જોઈએ."
  kyc: "તમારું KYC પૂરું નથી, તેથી પેમેન્ટ અટકેલું છે. કૃપા કરીને KYC પૂરું કરો: {kyc_link} — અમારી ટીમ તમારી મદદ કરશે."
  bank_not_updated: "તમારી બેંક વિગતો હજુ અપડેટ થઈ નથી, તેથી પેમેન્ટ ફરી મોકલીએ તો ફરીથી નિષ્ફળ જશે. કૃપા કરીને બેંક વિગતો અપડેટ કરો; અમારી ટીમ તમારો સંપર્ક કરશે."
  offer: "તમે ₹{amount} સુધીની લોન માટે પાત્ર છો ({lender_name}). વ્યાજ {apr_pct}% વાર્ષિક, પ્રોસેસિંગ ફી ₹{fee}, મુદત {tenure} મહિના, કુલ ચુકવણી ₹{total}. ફરિયાદ: {grievance}. શું હું ઓફર મોકલું?"
  offer_accepted: "તમારી ₹{amount} ની લોન ઓફર {offer_id} સ્વીકારાઈ ગઈ છે."
  offer_declined: "ઠીક છે, મેં ઓફર મોકલી નથી."
  offer_not_eligible: "હાલમાં તમે લોન માટે પાત્ર નથી."
  offer_later: "હાલમાં લોન ઓફર આપવી યોગ્ય નથી, આપણે પછી વાત કરીશું."
  credit_line_offer: "તમે ₹{amount} સુધીની ટૂંકા ગાળાની ક્રેડિટ લાઇન માટે પાત્ર છો ({lender_name}). {free_days} દિવસમાં ચુકવણી કરો તો કોઈ વ્યાજ કે ફી નહીં; પછી {apr_pct}% વાર્ષિક વ્યાજ અને ₹{late_fee} લેટ ફી. ફરિયાદ: {grievance}. શું હું આ ક્રેડિટ લાઇન ચાલુ કરું?"
  credit_line_accepted: "તમારી ₹{amount} ની ક્રેડિટ લાઇન {offer_id} સ્વીકારાઈ ગઈ છે."
  credit_line_not_eligible: "હાલમાં તમે ક્રેડિટ લાઇન માટે પાત્ર નથી."
  device_requested: "તમારા માટે {device} ની request અમારી field team ને મોકલી દીધી છે (ટિકિટ {ticket_id}). તેઓ તમારો સંપર્ક કરીને કિંમત જણાવશે; હમણાં કંઈ ખરીદાયું કે ચાર્જ થયું નથી."
  device_declined: "ઠીક છે, મેં કોઈ request મોકલી નથી."
  device_not_needed: "તમારા payments પ્રમાણે હાલ તમારું હાલનું device જ યોગ્ય છે. જરૂર બદલાશે તો અમે જણાવીશું."
  device_later: "હાલ નવું device આપવું યોગ્ય નથી, પહેલા બાકીનું કામ પૂરું થાય. પછી વાત કરીશું."
  device_ticket: "તમારા ડિવાઇસની સમસ્યા માટે ટિકિટ {ticket_id} નોંધી દીધી છે."
  handoff: "હું આ અમારી ટીમને મોકલું છું, તેઓ જલ્દી તમારો સંપર્ક કરશે."
  human: "ચોક્કસ, હું તમને અમારી ટીમના સભ્ય સાથે જોડું છું."
  refund: "રિફંડ હું જાતે કરી શકતો નથી, તેથી આ અમારી ટીમને મોકલું છું."
  action_failed: "પેમેન્ટ મોકલવામાં મુશ્કેલી આવી, તેથી કંઈ બદલાયું નથી. અમારી ટીમ આ તપાસશે."
  step_up: "આ રકમ માટે OTP ચકાસણી જરૂરી છે; અમારી ટીમ તેની ચકાસણી કરશે."
  unclear: "માફ કરશો, મને સમજાયું નહીં. હું આ અમારી ટીમને મોકલું છું."
  nothing_pending: "હાલમાં કોઈ બાકી વિનંતી નથી. કહો, હું શું મદદ કરું?"
en-IN:
  insurance_offer: "Since {why}, this cover fits you: {product_name} from {insurer_name}. Cover up to Rs {cover}, premium about Rs {premium} a year (illustrative). It covers {covers}. Do you want the insurer to contact you? Please say yes or no. Questions: {grievance}."
  insurance_interest: "Done. I noted your interest (reference {lead_id}). {insurer_name} will contact you. No premium was charged and no policy is issued yet."
  insurance_declined: "No problem, nothing was recorded. Ask me any time if you want insurance for your shop."
  insurance_none: "I do not have a suitable insurance for your shop right now."
  insurance_later: "An insurance offer is not appropriate right now. We will tell you when it is."
  all_good: "All your settlements are successful, nothing is pending."
  retriggered: "Your payout of ₹{amount} has been re-sent."
  ticket_raised: "Ticket {ticket_id} has been created."
  ticket_updated: "Your existing ticket {ticket_id} has been updated."
  over_limit: "This amount is large, so for your security our team will verify it before sending."
  pending_wait: "Your ₹{amount} payout is being processed by the bank. It should arrive in about {eta_hours} hours."
  kyc: "Your KYC is incomplete, which is holding the payout. Please complete it here: {kyc_link} — our team will help you."
  bank_not_updated: "Your bank details are not updated yet, so a retry would fail again. Please update them; our team will reach out."
  offer: "You are eligible for a loan of up to ₹{amount} ({lender_name}). Interest {apr_pct}% p.a., processing fee ₹{fee}, tenure {tenure} months, total repayable ₹{total}. Grievance: {grievance}. Shall I send the offer?"
  offer_accepted: "Your loan offer {offer_id} for ₹{amount} is accepted."
  offer_declined: "Okay, I have not sent the offer."
  offer_not_eligible: "You are not eligible for a loan right now."
  offer_later: "It is not the right time for a loan offer; we can talk later."
  credit_line_offer: "You are eligible for a short-term credit line of up to ₹{amount} ({lender_name}). No interest or fee if repaid within {free_days} days; after that {apr_pct}% p.a. interest and a ₹{late_fee} late fee. Grievance: {grievance}. Shall I activate this credit line?"
  credit_line_accepted: "Your credit line {offer_id} for ₹{amount} is accepted."
  credit_line_not_eligible: "You are not eligible for a credit line right now."
  device_requested: "A request for a {device} has been sent to our field team (ticket {ticket_id}). They will contact you and tell you the price; nothing has been bought or charged yet."
  device_declined: "Okay, I have not sent any request."
  device_not_needed: "Based on your payments, your current device is the right one for now. We will let you know if that changes."
  device_later: "It is not the right time for a new device; let us finish the open work first. We can talk later."
  device_ticket: "I have logged ticket {ticket_id} for your device issue."
  handoff: "I am passing this to our team; they will contact you shortly."
  human: "Sure, I am connecting you to a member of our team."
  refund: "I cannot process refunds myself, so I am passing this to our team."
  action_failed: "The payout hit a problem, so nothing was changed. Our team will look into it."
  step_up: "This amount needs OTP verification; our team will verify it."
  unclear: "Sorry, I did not understand. I am passing this to our team."
  nothing_pending: "There is no pending request right now. How can I help?"
