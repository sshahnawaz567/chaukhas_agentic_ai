  insurance_interest: "Ho gaya. Maine aapki ruchi note kar li (reference {lead_id}). {insurer_name} aapse sampark karega. Koi premium nahi kata aur abhi koi policy issue nahi hui."
  insurance_declined: "Koi baat nahi, kuch record nahi kiya. Shop ke insurance ke liye jab chahein pooch lijiye."
  insurance_none: "Abhi aapki shop ke liye koi suitable insurance nahi hai."
  insurance_later: "Abhi insurance offer sahi nahi rahega. Sahi samay par bata denge."
  all_good: "Aapke sabhi settlements successful hain, koi payment pending nahi hai."
  retriggered: "Aapka ₹{amount} ka payment dobara bhej diya gaya hai."
  ticket_raised: "Ticket {ticket_id} bana diya gaya hai."
  ticket_updated: "Pehle se khula ticket {ticket_id} update kar diya hai."
