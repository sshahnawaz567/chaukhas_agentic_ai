  offer: "Aap ₹{amount} tak ke loan ke liye eligible hain ({lender_name}). Byaaj {apr_pct}% saalana, processing fee ₹{fee}, avadhi {tenure} mahine, kul wapsi ₹{total}. Shikayat: {grievance}. Kya main offer bhejoon?"
